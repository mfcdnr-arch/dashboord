[tool.ruff]
line-length = 130
target-version = "py312"
# tests/ намеренно не проверяем: там принят стиль поздних import'ов внутри
# функций (изоляция фикстур), рефактор ради линтера тут не нужен.
extend-exclude = ["tests"]

[tool.ruff.lint]
# Прагматичный набор — ловит реальные ошибки (незаявленные имена, недостижимый
# код, забытые импорты), не навязывает стилевой рефакторинг всего кода разом.
select = ["E", "F", "I", "B"]
ignore = [
    "B008",  # Depends(...) в дефолтах параметров — идиома FastAPI, не баг
    "B904",  # raise ... from — накопленный долг (~90 мест), чинить по ходу правок файла
    "E701",  # компактный стиль автора (if x: return y на одной строке) — не баг
    "E702",
]

[tool.ruff.lint.per-file-ignores]
# Справочник ведомств и услуг — названия скопированы из госформы ДОСЛОВНО, и
# самое длинное занимает тысячу знаков. Разрывать их на строки нельзя: по
# такому названию ищут в файле целиком, а склеенная из кусков строка перестаёт
# находиться поиском и начинает расходиться с формой при первой же правке.
"app/modules/dnr_stats/departments.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["app"]
