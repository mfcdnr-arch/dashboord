[pytest]
# Асинхронные тесты без явного маркера на каждой функции.
asyncio_mode = auto
# Один event loop на всю сессию — иначе сессионный пул БД и пофункционные
# тесты оказываются в разных loop'ах («attached to a different loop»).
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
addopts = -q
