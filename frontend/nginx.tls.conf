# nginx для прод-образа фронтенда (HTTPS, LAN, самоподписанный сертификат).
# Подключается через docker-compose.tls.yml (deploy.sh --tls): монтирует этот
# файл вместо default.conf и сертификаты в /etc/nginx/certs.
# Общие маршруты — из nginx.locations.conf (тот же список, что и для HTTP).

# Зона rate-limit для /auth/login (перебор паролей): 10 запросов/мин с одного IP.
limit_req_zone $binary_remote_addr zone=auth_login:1m rate=10r/m;

# HTTP → редирект на HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # HSTS: браузер запоминает HTTPS (полгода). В закрытой LAN — безопасно.
    add_header Strict-Transport-Security "max-age=15768000" always;

    include /etc/nginx/dashbord-locations.conf;
}
