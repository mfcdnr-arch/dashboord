# nginx для прод-образа фронтенда (HTTP): отдаёт SPA и проксирует API на api:8000.
# Общие маршруты — в nginx.locations.conf (include ниже), тот же список для HTTPS.

# HSTS для location, у которых есть СВОЙ add_header (там наследование
# серверных заголовков nginx отключает). В HTTP-варианте значение пустое —
# такой заголовок nginx не отправляет.
map $scheme $hsts_header {
    https   "max-age=15768000";
    default "";
}

# Зона rate-limit для /auth/login (перебор паролей): 10 запросов/мин с одного IP.
# Сама «location = /auth/login» — в общем nginx.locations.conf.
limit_req_zone $binary_remote_addr zone=auth_login:1m rate=10r/m;
# Зона rate-limit для /auth/blocked-appeal (обращение без токена — заблокированный
# аккаунт): без неё можно было бы засыпать админов спамом с одного IP.
limit_req_zone $binary_remote_addr zone=blocked_appeal:1m rate=5r/m;

server {
    listen 80;
    server_name _;
    include /etc/nginx/dashbord-locations.conf;
}
