# nginx для прод-образа фронтенда: отдаёт SPA и проксирует API-маршруты на api:8000.
# Список префиксов совпадает с dev-прокси vite.config.ts — при добавлении нового
# корневого пути API его нужно добавить И сюда, И в vite.config.ts.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Загрузка документов (Excel/PDF/Word) — увеличенный лимит тела запроса.
    client_max_body_size 50m;

    # API → бэкенд. X-Forwarded-For нужен модулю аудита (запись ip_address).
    location ~ ^/(health|system|auth|objects|folders|document-versions|extraction-jobs|dataset-releases|metrics|dashboards|dashboard-pages|dashboard-templates|widgets|home|users|departments|roles|login-events|reports|audit|moderation)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Статика SPA с длинным кэшем (файлы с хэшем в имени).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Всё остальное — index.html (SPA-роутинг на стороне клиента).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
