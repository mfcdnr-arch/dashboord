# Общие директивы сервера (root, лимит тела) + маршруты. ЕДИНЫЙ источник —
# включается через `include` и в HTTP (nginx.conf), и в HTTPS (nginx.tls.conf),
# чтобы список API-маршрутов не расходился между вариантами.
# NB: список префиксов ниже должен совпадать с dev-прокси vite.config.ts.
root /usr/share/nginx/html;
index index.html;

# Загрузка документов (Excel/PDF/Word) — увеличенный лимит тела запроса.
client_max_body_size 50m;

# Сжатие: SPA-бандл и JSON-ответы API (gzip_proxied any). В образе nginx gzip
# по умолчанию ВЫКЛЮЧЕН — на слабых клиентских машинах МФЦ разница заметна.
# woff2/png не сжимаем — уже сжаты.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

# Security-заголовки (общие для HTTP и HTTPS; HSTS — только в TLS-конфиге).
# ВАЖНО nginx: add_header НЕ наследуется в location, где есть свой add_header, —
# поэтому в /assets/ и /fonts/ ниже эти строки продублированы.
# CSP: токен хранится в localStorage — CSP ограничивает последствия любого XSS.
# 'unsafe-inline' для style — React-инлайн-стили; data:/blob: для img — виджеты-
# картинки (data-URI) и экспорт PNG/PDF.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

# Логин: rate-limit ещё до бэкенда (в приложении дополнительно есть блокировка
# по логину после N неудач). Точная location (=) приоритетнее regex ниже.
location = /auth/login {
    limit_req zone=auth_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API → бэкенд. X-Forwarded-For нужен модулю аудита (запись ip_address).
location ~ ^/(health|system|auth|objects|folders|document-versions|extraction-jobs|dataset-releases|metrics|dashboards|dashboard-pages|dashboard-templates|widgets|home|users|departments|roles|login-events|reports|audit|moderation|catalog|notifications|maintenance|archive|archive-access|appeals)(/|$) {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# Статика SPA с длинным кэшем (файлы с хэшем в имени).
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # свой add_header отключает наследование — security-заголовки повторно:
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri =404;
}

# Фирменные шрифты (self-host PT Sans, .woff2) — длинный кэш: имена стабильны.
location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri =404;
}

# Всё остальное — index.html (SPA-роутинг на стороне клиента).
location / {
    try_files $uri $uri/ /index.html;
}
