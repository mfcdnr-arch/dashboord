# Наблюдаемость Dashboard (self-hosted, on-prem LAN): метрики (Prometheus),
# визуализация (Grafana), логи (Loki + Promtail), хост/контейнеры (node-exporter,
# cAdvisor). Запускается ПОСЛЕ основного стека (использует его сеть для скрейпа api).
#
#   docker compose -f docker-compose.monitoring.yml --env-file .env.prod up -d
#   Grafana:    http://<сервер>:3000  (admin / GRAFANA_PASSWORD)
#   Prometheus: http://<сервер>:9090
#
# Образы пинятся (воспроизводимость/офлайн). Наружу открыты Grafana и Prometheus;
# Loki/promtail/exporters — только во внутренней сети.
name: dashbord-monitoring

# Ротация логов контейнеров (иначе json-логи растут неограниченно).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Сеть основного прод-стека (чтобы Prometheus резолвил `api`). Должна
  # существовать — поднимите сначала docker-compose.prod.yml.
  default:
    name: dashbord-prod_default
    external: true

volumes:
  promdata:
  grafanadata:
  lokidata:

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    container_name: dashbord_prometheus
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    container_name: dashbord_grafana
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, loki]
    restart: unless-stopped

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.1.1}
    container_name: dashbord_loki
    logging: *default-logging
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    restart: unless-stopped

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.1.1}
    container_name: dashbord_promtail
    logging: *default-logging
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.8.2}
    container_name: dashbord_node_exporter
    logging: *default-logging
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1}
    container_name: dashbord_cadvisor
    logging: *default-logging
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
