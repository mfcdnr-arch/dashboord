# Dashboard — инфраструктура для локальной разработки (Docker Desktop).
# Отдельный стек, не пересекается с проектом DS (свои имена и порты).
# Запуск:  docker compose -p dashbord up -d
# Остановка: docker compose -p dashbord down
name: dashbord

services:
  postgres:
    # Прод-цель — postgres:16-alpine; локально используем доступный образ (сеть к Docker Hub недоступна).
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: dashbord_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashbord}
      POSTGRES_USER: ${POSTGRES_USER:-dashbord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashbord}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - dashbord_pgdata:/var/lib/postgresql/data
      # Авто-накат миграций при ПЕРВОМ старте (пустой том), по порядку 001..006
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashbord} -d ${POSTGRES_DB:-dashbord}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dashbord_redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - dashbord_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: dashbord_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-dashbord}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-dashbord123}
    ports:
      - "${MINIO_API_PORT:-9800}:9000"
      - "${MINIO_CONSOLE_PORT:-9801}:9001"
    volumes:
      - dashbord_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    container_name: dashbord_api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dashbord}
      POSTGRES_USER: ${POSTGRES_USER:-dashbord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashbord}
      APP_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8000"
    restart: unless-stopped

  # --- Появятся позже ---
  # frontend:  React + TypeScript (viewer + админка) — порт 3080
  # worker:    фоновые задачи (извлечение документов, пересчёт метрик, очистка архива)

volumes:
  dashbord_pgdata:
  dashbord_redisdata:
  dashbord_miniodata:
